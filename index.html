<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Nathan Transportes — Gestão Documental</title>
    <meta
      name="description"
      content="Sistema de gestão documental e cadastro automatizado de motoristas, proprietários e veículos para a El Nathan Transportes."
    />
    <meta property="og:title" content="El Nathan Transportes — Gestão Documental" />
    <meta
      property="og:description"
      content="Sistema de gestão documental e cadastro automatizado de motoristas, proprietários e veículos para a El Nathan Transportes."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('elnathan_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F4F6FA] text-slate-900 dark:bg-[#07090E] dark:text-slate-100 antialiased selection:bg-blue-600/25 selection:text-blue-700 dark:selection:text-blue-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
